# Reusable pieces vs Titan-only. Sync: ./scripts/sync-modules.sh
# status:
#   upstream   — public remote; we overlay Titan bits
#   vendored   — in-tree copy of upstream + our maps (submodule when remote is stable)
#   unpublished — our code, no public repo yet; lives in this git
#   in_tree    — Titan-only; not a separate repo
schema: atlasos.modules.v1

modules:
  - name: titan2-touchpadd
    role: pad / mouse daemon
    path: third_party/titan2-touchpadd
    remote: https://github.com/Abyss-c0re/titan2-touchpadd.git
    mirror: https://gitea.angry.im/Abyss-c0re/titan2-touchpadd.git
    ssh: ssh://git@gitea-ssh.angry.im:2222/Abyss-c0re/titan2-touchpadd.git
    upstream: https://gitea.angry.im/PeterGSI/titan2-touchpadd.git
    ref: main
    status: submodule
    reusable: true
    note: Git submodule. Build pulls this SHA, compiles musl, packs the ELF into the GSI. ELF is not in git.

  - name: openeuicc
    role: eSIM LPA
    path: third_party/openeuicc
    remote: https://gitea.angry.im/PeterCxy/OpenEUICC.git
    license: GPL-3.0
    status: fetch
    reusable: true
    note: APK not in git. ./third_party/openeuicc/fetch.sh

  - name: microg
    role: optional Play-compat
    path: packages/microg
    remote: https://github.com/microg/GmsCore.git
    status: fetch
    reusable: true
    note: Flavor microg only. ./packages/microg/fetch.sh

  - name: atlas
    role: terminal + Debian plane
    path: apps/titan_atlas
    remote: null
    status: unpublished
    reusable: true
    note: Split to its own git when published. Until then this tree is SoT.

  - name: nanobot
    role: Grok + LAN / on-device models
    path: apps/titan_nanobot
    remote: https://github.com/Abyss-c0re/nanobot.git
    status: unpublished
    reusable: true
    note: >
      Core nanobot is public (Abyss-c0re/nanobot). This path is the Titan
      Android wrapper — unpublished until split.

  - name: titan-controls
    role: Titan pad / keys / Settings hub
    path: apps/titan_controls
    remote: null
    status: in_tree
    reusable: false

  - name: titan-usb-hid
    role: USB / BT HID gadget
    path: apps/titan_usb_hid
    remote: null
    status: in_tree
    reusable: false

  - name: titan-fm
    role: FM / IR
    path: apps/titan_fm
    remote: null
    status: in_tree
    reusable: false

  - name: cube-contact
    role: optional rear lattice
    path: apps/cube_contact
    remote: null
    status: in_tree
    reusable: false
    note: Display face only. Not a second OS.

upstreams:
  - name: lineageos
    remote: https://github.com/LineageOS/android.git
    ref: lineage-23.2
    role: platform
  - name: misterztr-gsi
    remote: https://github.com/MisterZtr/LineageOS_gsi.git
    ref: lineage-23.2
    role: gsi-recipe
  - name: misterztr-treble
    remote: https://github.com/MisterZtr/treble_manifest.git
    ref: lineage-23.2
    role: local-manifest
