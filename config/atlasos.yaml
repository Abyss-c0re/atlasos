# AtlasOS product flags (CyberDeck / HybridOS)
product: atlasos
codename: cyberdeck
device: unihertz-titan2
gsi:
  family: LineageOS-23.2
  variant: VANILLA-EXT4
  recipe: misterztr
  live_pin: "20260804"

features:
  touchpadd: true
  controls: true
  usb_hid: true
  atlas: true
  nanobot: true
  cube_contact: true          # rear lattice only
  cube_icons: true            # square mask + cube-ux
  square_chrome: false        # full zero-radius RROs stay off
  fm_ir: true
  openeuicc: true
  microg: true                # flavor default; fetch at build, not in git
  ims_safe: true
  clanker: false
  hive: false

inject:
  # AtlasOS builds mouse into the GSI (SERIES 0040 + stage). Inject is off here.
  # Workshop pin 20260804 (already-exported image) still injects — not this path.
  touchpadd: false
