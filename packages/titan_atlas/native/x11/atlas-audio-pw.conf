# Desk sink. Do not load ALSA. AudioFlinger owns the speaker.
context.modules = [
    { name = libpipewire-module-pipe-tunnel
      args = {
        tunnel.mode = sink
        pipe.filename = /tmp/atlas-audio.fifo
        audio.format = S16
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        node.name = atlas-android
        node.description = "Atlas Android"
        tunnel.may-pause = true
        # Input mode never arms a timer. A want-driver sink stalls the graph.
        stream.props = {
          node.want-driver = false
          priority.driver = 0
        }
      }
    }
]
