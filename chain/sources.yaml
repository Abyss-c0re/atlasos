# AtlasOS source lockfile.
# This file names upstreams. Trees stay local. Never upload upload:never.
schema: atlasos.chain.v1
product: atlasos
codename: cyberdeck
device: unihertz-titan2

links:
  misterztr_gsi:
    url: https://github.com/MisterZtr/LineageOS_gsi
    ref: lineage-23.2
    role: gsi_recipe
    upload: never

  lineage_tree:
    env: MISTERZTR_TREE
    default: ~/Dev/titanus2-artifacts/misterztr_lineage
    role: android_tree
    note: repo-synced Lineage + MisterZtr apply-patches. Not in this git.
    upload: never

  unihertz_stock:
    role: vendor_train
    note: >
      Region-matching stock OEM zip the builder already owns.
      Unihertz publishes no kernel or device sources. Never commit the zip.
    upload: never

  workshop:
    env: TITANUS2_WORKSHOP
    default: ../titanus2
    role: optional_lab
    note: Lab flash / kitchen only. Clone-to-build does not need it.
    upload: never

  titan2_touchpadd:
    url: https://github.com/Abyss-c0re/titan2-touchpadd
    mirror: https://gitea.angry.im/Abyss-c0re/titan2-touchpadd
    ssh: ssh://git@gitea-ssh.angry.im:2222/Abyss-c0re/titan2-touchpadd.git
    upstream: https://gitea.angry.im/PeterGSI/titan2-touchpadd
    role: pad_runtime
    upload: never

  pocket_board:
    url: https://github.com/SinuXVR/pocket-board
    license: GPL-3.0
    role: ime
    upload: never

  openeuicc:
    url: https://gitea.angry.im/PeterCxy/OpenEUICC
    license: GPL-3.0
    role: esim
    upload: never
    note: Fetch APK locally. Do not commit the APK.

  lineageos:
    url: https://github.com/LineageOS
    role: platform
    upload: never

pin:
  gsi_family: LineageOS-23.2
  gsi_variant: VANILLA-EXT4
  # Live matching pin (workshop). Next AtlasOS export gets a new date.
  live_pin: "20260804"
  note: >
    AtlasOS next export patches MISTERZTR_TREE (0040 + stage) and builds
    titan2-touchpadd into the GSI. That pack uses WITH_TOUCHPADD_INJECT=0.
    Already-flashed workshop pin 20260804 still has no ELF — inject stays
    on for that image only.
